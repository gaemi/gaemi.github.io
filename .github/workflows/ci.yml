name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HAS_WRITING_KEY: ${{ secrets.WRITING_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout private writing repository
        if: env.HAS_WRITING_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: gaemi/writing
          ssh-key: ${{ secrets.WRITING_DEPLOY_KEY }}
          path: .writing

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run verify
