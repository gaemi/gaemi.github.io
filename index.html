<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gaemi apps</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --fg: #171a1d;
      --muted: #65707a;
      --card: #ffffff;
      --border: #e5e8ef;
      --link: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101316;
        --fg: #e7eaee;
        --muted: #aeb6bf;
        --card: #191d22;
        --border: #333941;
        --link: #8fa7ff;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
    }

    a {
      color: var(--link);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>gaemi apps</h1>
      <p>Public policy and support pages for apps by gaemi.</p>
      <ul>
        <li><a href="/apps/use-trail/privacy/">UseTrail Privacy Policy</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
